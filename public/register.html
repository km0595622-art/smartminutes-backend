<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register</title>

<style>
body{
font-family:Arial,sans-serif;
background:#eef3ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
padding:30px;
border-radius:10px;
width:340px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:12px;
background:#0066ff;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>Create Account</h2>

<input placeholder="Full Name">

<input type="email" placeholder="Email">

<input placeholder="Phone Number">

<input type="password" placeholder="Password">

<button>Create Account</button>

</div>

</body>
</html>

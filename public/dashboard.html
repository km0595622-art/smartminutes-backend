<!DOCTYPE html>

<title>SmartMinute Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:
        linear-gradient(
            135deg,
            #020914,
            #071a35 55%,
            #15100a
        );
    color:#172033;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================================
   FALLING MONEY BACKGROUND
========================================= */

.money-background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.money{
    position:absolute;
    top:-160px;

    font-size:82px;

    opacity:.42;

    filter:
        drop-shadow(0 8px 8px rgba(0,0,0,.35))
        drop-shadow(0 0 8px rgba(218,165,46,.18));

    animation:
        moneyFall linear infinite,
        moneySwing ease-in-out infinite;

    will-change:transform,top;
}

/* different positions */

.money:nth-child(1){
    left:2%;
    font-size:88px;
    animation-duration:13s,4s;
    animation-delay:0s,0s;
}

.money:nth-child(2){
    left:12%;
    font-size:105px;
    animation-duration:17s,5s;
    animation-delay:2s,1s;
}

.money:nth-child(3){
    left:23%;
    font-size:78px;
    animation-duration:14s,4s;
    animation-delay:5s,2s;
}

.money:nth-child(4){
    left:34%;
    font-size:110px;
    animation-duration:19s,6s;
    animation-delay:1s,1s;
}

.money:nth-child(5){
    left:47%;
    font-size:86px;
    animation-duration:15s,4s;
    animation-delay:6s,0s;
}

.money:nth-child(6){
    left:59%;
    font-size:104px;
    animation-duration:18s,5s;
    animation-delay:3s,2s;
}

.money:nth-child(7){
    left:71%;
    font-size:82px;
    animation-duration:13s,4s;
    animation-delay:7s,1s;
}

.money:nth-child(8){
    left:83%;
    font-size:108px;
    animation-duration:20s,6s;
    animation-delay:2s,3s;
}

.money:nth-child(9){
    left:94%;
    font-size:84px;
    animation-duration:16s,5s;
    animation-delay:8s,0s;
}

/* FALLING */

@keyframes moneyFall{

    0%{
        top:-180px;
        opacity:0;
        transform:
            rotate(-25deg)
            scale(.85);
    }

    10%{
        opacity:.42;
    }

    50%{
        opacity:.48;
    }

    90%{
        opacity:.38;
    }

    100%{
        top:115vh;
        opacity:0;
        transform:
            rotate(360deg)
            scale(1.05);
    }

}

/* SIDE TO SIDE */

@keyframes moneySwing{

    0%{
        margin-left:-25px;
    }

    50%{
        margin-left:25px;
    }

    100%{
        margin-left:-25px;
    }

}

/* =========================================
   HEADER
========================================= */

header{
    position:sticky;
    top:0;
    z-index:10;

    height:78px;

    padding:10px 16px;

    background:rgba(3,13,27,.96);

    border-bottom:
        1px solid
        rgba(218,165,46,.35);

    box-shadow:
        0 4px 20px
        rgba(0,0,0,.35);

    display:flex;
    align-items:center;
    justify-content:space-between;
}

/* =========================================
   PROFILE BUTTON
========================================= */

.profile-button{
    width:48px;
    height:48px;

    border-radius:50%;

    border:2px solid #d9a52e;

    background:#071a31;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 0 12px
        rgba(218,165,46,.2);
}

.profile-icon{
    width:25px;
    height:25px;
    position:relative;
}

.profile-icon:before{
    content:"";

    position:absolute;

    width:10px;
    height:10px;

    border:2px solid #e8b83f;

    border-radius:50%;

    top:0;
    left:50%;

    transform:translateX(-50%);
}

.profile-icon:after{
    content:"";

    position:absolute;

    width:22px;
    height:11px;

    border:2px solid #e8b83f;

    border-radius:
        14px 14px
        8px 8px;

    bottom:0;
    left:50%;

    transform:translateX(-50%);
}

/* =========================================
   LIVE ROTATING GOLD CLOCK
========================================= */

.brand{
    text-align:center;
    color:#e8b83f;
}

/* Clock body — realistic slow anticlockwise motion */
.logo{
    width:64px;
    height:64px;
    border:3px solid #d9a52e;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 38% 32%,
            #3b2b08 0%,
            #17130a 38%,
            #07101f 76%
        );

    position:relative;
    margin:auto;

    box-shadow:
        0 0 8px rgba(218,165,46,.35),
        0 0 20px rgba(218,165,46,.22),
        inset 0 0 12px rgba(246,209,91,.12);

    animation:
        clockBodyAnti 18s linear infinite;

    transform-origin:center center;
}

/* Inner golden rim */
.logo::marker{
    content:"";
}

/* Minute hand */
.logo:before{
    content:"";
    position:absolute;

    width:3px;
    height:22px;

    background:
        linear-gradient(
            to bottom,
            #fff0a0,
            #f0c34f 45%,
            #b77b12
        );

    left:50%;
    top:50%;

    transform:
        translate(-50%,-100%)
        rotate(0deg);

    transform-origin:
        50% 100%;

    border-radius:4px;

    box-shadow:
        0 0 4px rgba(240,195,79,.8),
        0 0 9px rgba(218,165,46,.45);

    animation:
        clockMinute 6s linear infinite;

    z-index:5;
}

/* Hour hand */
.logo:after{
    content:"";
    position:absolute;

    width:16px;
    height:4px;

    background:
        linear-gradient(
            to right,
            #fff0a0,
            #f0c34f,
            #b77b12
        );

    left:50%;
    top:50%;

    transform:
        translateY(-50%)
        rotate(35deg);

    transform-origin:
        0% 50%;

    border-radius:4px;

    box-shadow:
        0 0 4px rgba(240,195,79,.8),
        0 0 9px rgba(218,165,46,.45);

    animation:
        clockHour 18s linear infinite;

    z-index:5;
}

/* Realistic clockwise hand movement */
@keyframes clockMinute{
    from{
        transform:
            translate(-50%,-100%)
            rotate(0deg);
    }
    to{
        transform:
            translate(-50%,-100%)
            rotate(360deg);
    }
}

@keyframes clockHour{
    from{
        transform:
            translateY(-50%)
            rotate(35deg);
    }
    to{
        transform:
            translateY(-50%)
            rotate(395deg);
    }
}

/* Clock body moves anticlockwise */
@keyframes clockBodyAnti{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(-360deg);
    }
}

.drop{
    position:absolute;

    background:
        linear-gradient(
            #f6d15b,
            #d9a52e 45%,
            #b77b12
        );

    border-radius:
        0 0 8px 8px;

    box-shadow:
        0 2px 5px rgba(0,0,0,.25),
        0 0 7px rgba(218,165,46,.28);
}

.drop1{
    width:7px;
    height:14px;
    left:10px;
    bottom:-11px;
}

.drop2{
    width:9px;
    height:18px;
    left:26px;
    bottom:-15px;
}

.drop3{
    width:7px;
    height:12px;
    right:11px;
    bottom:-9px;
}

.brand-name{
    font-size:13px;
    font-weight:bold;
    margin-top:5px;
    color:#e8b83f;
    text-shadow:
        0 0 4px rgba(218,165,46,.55),
        0 0 10px rgba(218,165,46,.25);
}


/* =========================================
   INVITE
========================================= */

.invite-button{
    width:44px;
    height:44px;

    border-radius:50%;

    border:1px solid #00f5ff;

    background:

            circle,
            rgba(0,245,255,.18),
            rgba(8,20,42,.96) 65%

    color:#00f5ff;

    font-size:21px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 0 7px #00f5ff,
        0 0 16px rgba(0,245,255,.45),
        inset 0 0 10px rgba(0,245,255,.12);

    text-shadow:
        0 0 6px #00f5ff,
        0 0 12px rgba(0,245,255,.7);

    animation:
        inviteNeonPulse 2.2s ease-in-out infinite;

    transition:

        box-shadow .2s ease;
}

.invite-button:hover{

        0 0 10px #00f5ff,
        0 0 24px rgba(0,245,255,.65),
        0 0 40px rgba(157,0,255,.25),
        inset 0 0 13px rgba(0,245,255,.16);

.invite-button:active{

}

@keyframes inviteNeonPulse{

    padding:13px;

    border:0;

    border-radius:9px;

    background:#8b1e1e;

    color:white;

    font-weight:bold;

    cursor:pointer;

/* =========================================
   LOAD WALLET
========================================= */

async function loadWallet(){

    try{

        const response = await fetch(
            API_BASE + "/api/wallet",
            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }
        );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Failed to load wallet."
            );

        }

        const wallet =
            data.wallet;

        const withdrawable =
            Number(
                wallet.withdrawable_balance || 0
            );

        document.getElementById(
            "balance"
        ).textContent =
            "KSh " +
            withdrawable.toLocaleString(
                "en-KE",
                {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                }
            );

    }catch(error){

        console.error(
            "WALLET LOAD ERROR:",
            error
        );

        showMessage(
            "Unable to load wallet balance."
        );

    }

}

    bottom: 17%;

const API_BASE = window.location.origin;

    );

/* =========================================
   REFRESH USER PROFILE
========================================= */

async function refreshUserProfile(){

    try{

        const response = await fetch(
            API_BASE + "/api/membership",
            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }
        );

        if(!response.ok){
            return;
        }

        const data = await response.json();

        if(data.user){

            savedUser = {
                ...savedUser,
                ...data.user
            };

            localStorage.setItem(
                "user",
                JSON.stringify(savedUser)
            );
        }

    }catch(error){

        console.log(
            "USER PROFILE REFRESH ERROR:",
            error
        );

    }

}

/* =========================================
   SMARTMINUTE ACTION FOREGROUND CONTROLLER
========================================= */

function openSmartMinuteAction(content){

    const overlay =
        document.getElementById("smActionOverlay");

    const target =
        document.getElementById("smActionContent");

    if(!overlay || !target){
        return;
    }

    target.innerHTML = content || "";

    overlay.classList.add("active");
    overlay.setAttribute("aria-hidden","false");

    document.body.classList.add(
        "sm-action-open"
    );

}


function closeSmartMinuteAction(){

    const overlay =
        document.getElementById(
            "smActionOverlay"
        );

    const target =
        document.getElementById(
            "smActionContent"
        );

    const profile =
        document.getElementById(
            "profilePanel"
        );


    if(!overlay || !target){
        return;
    }


    /* =========================================
       RESTORE PROFILE TO ORIGINAL LOCATION
    ========================================= */

    if(
        profile &&
        profile.dataset.smMoved === "true" &&
        profile._smOriginalParent
    ){

        profile.style.display = "none";

        profile._smOriginalParent.insertBefore(
            profile,
            profile._smOriginalNextSibling
        );

        delete profile._smOriginalParent;
        delete profile._smOriginalNextSibling;

        profile.dataset.smMoved = "false";
    }


    /* =========================================
       CLOSE FOREGROUND
    ========================================= */

    overlay.classList.remove(
        "active"
    );

    overlay.setAttribute(
        "aria-hidden",
        "true"
    );

    target.innerHTML = "";

    document.body.classList.remove(
        "sm-action-open"
    );

}



document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            const overlay =
                document.getElementById(
                    "smActionOverlay"
                );

            if(
                overlay &&
                overlay.classList.contains("active")
            ){

                closeSmartMinuteAction();

            }

        }

    }
);


/* =========================================
   PROFILE
========================================= */

function toggleProfile(){

    const panel =
        document.getElementById(
            "profilePanel"
        );

    const overlay =
        document.getElementById(
            "smActionOverlay"
        );

    const target =
        document.getElementById(
            "smActionContent"
        );


    if(!panel || !overlay || !target){
        return;
    }


    /* =========================================
       CLOSE PROFILE IF ALREADY OPEN
    ========================================= */

    if(
        overlay.classList.contains("active") &&
        panel.dataset.smMoved === "true"
    ){

        closeSmartMinuteAction();

        return;
    }


    /* =========================================
       REMEMBER ORIGINAL LOCATION
    ========================================= */

    panel._smOriginalParent =
        panel.parentNode;

    panel._smOriginalNextSibling =
        panel.nextSibling;

    panel.dataset.smMoved = "true";


    /* =========================================
       MOVE EXISTING PROFILE PANEL
       INTO FOREGROUND
    ========================================= */

    target.innerHTML = "";

    target.appendChild(panel);

    panel.style.display = "block";


    overlay.classList.add("active");

    overlay.setAttribute(
        "aria-hidden",
        "false"
    );

    document.body.classList.add(
        "sm-action-open"
    );


    /* =========================================
       KEEP PROFILE CONTENT VISIBLE
    ========================================= */

    panel.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

}

async function submitWithdrawal(){

    const amount =
        Number(
            document.getElementById(
                "withdrawAmount"
            ).value
        );

    const method =
        document.getElementById(
            "withdrawMethod"
        ).value;

    const destination =
        document.getElementById(
            "withdrawDestination"
        ).value.trim();

    const message =
        document.getElementById(
            "withdrawMessage"
        );

    if(!Number.isFinite(amount) || amount < 5000){

        message.textContent =
            "Minimum withdrawal amount is KSh 5,000.";

        return;

    }

    if(!destination){

        message.textContent =
            "Please enter your withdrawal destination.";

        return;

    }

    message.textContent =
        "Submitting withdrawal request...";

    try{

        const response = await fetch(
            API_BASE + "/api/withdrawal",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    Authorization:
                        "Bearer " + token
                },

                body:JSON.stringify({

                    amount,
                    method,
                    destination

                })

            }
        );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to create withdrawal."
            );

        }

        message.textContent =
            "Withdrawal request submitted successfully. " +
            "Your funds are now reserved pending admin review.";

        await loadWallet();

    }catch(error){

        console.error(
            "WITHDRAWAL ERROR:",
            error

        message.textContent =
            error.message ||
            "Unable to submit withdrawal.";

    }

}

async function loadUnlockStatus(){

    try{

        const response = await fetch(
            API_BASE + "/api/unlock/status",

                }
            }
        );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load trading status."
            );

        }

        if(data.tradingUnlocked){

            status.textContent =
                " Trading access is unlocked.";

            if(!sessionStorage.getItem("smartMinuteUnlockCelebrated")){
                sessionStorage.setItem(
                    "smartMinuteUnlockCelebrated",

            "Unable to load trading status.";

    }

/* =========================================
   CELEBRATION SOUND
========================================= */

function smartMinuteCelebrationSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext){
            return;
        }

        const ctx =
            new AudioContext();

        const now =
            ctx.currentTime;

        const notes = [
            523.25,
            659.25,
            783.99,
            1046.50
        ];

        notes.forEach(
            (frequency,index) => {

                const oscillator =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();

                oscillator.type =
                    "sine";

                oscillator.frequency.value =
                    frequency;

                gain.gain.setValueAtTime(
                    0.0001,
                    now + index * 0.11
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.18,
                    now + index * 0.11 + 0.025
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + index * 0.11 + 0.42
                );

                oscillator.connect(gain);
                gain.connect(ctx.destination);

                oscillator.start(
                    now + index * 0.11
                );

                oscillator.stop(
                    now + index * 0.11 + 0.45
                );

            }
        );

        setTimeout(() => {

            try{
                ctx.close();
            }catch(e){}

        }, 1800);

    }catch(error){

        console.log(
            "Celebration audio unavailable:",
            error
        );

    }

}

/* =========================================
   TASKS
========================================= */

async function startTasks(){

    const container =
        document.getElementById("smActionContent");

    if(!container){
        return;
    }

    /* Always clear the popup before loading task content. */
    container.innerHTML = "";

    try {

        /* =========================================
           ADMIN BYPASS
        ========================================= */

        let isAdmin = false;

        try {
            const profileResponse = await fetch(
                API_BASE + "/api/tasks",
                {
                    headers:{
                        Authorization:"Bearer " + token
                    }
                }
            );

            if(profileResponse.ok){
                const profileData =
                    await profileResponse.json();

                isAdmin = profileData.isAdmin === true;
            }

        } catch (_) {
            /* Wallet check below remains authoritative. */
        }


        /* =========================================
           BALANCE CHECK
        ========================================= */

        if(!isAdmin){

            const walletResponse =
                await fetch(
                    API_BASE + "/api/wallet",
                    {
                        headers:{
                            Authorization:
                                "Bearer " + token
                        }
                    }
                );

            const walletData =
                await walletResponse.json();

            if(!walletResponse.ok){

                throw new Error(
                    walletData.message ||
                    "Unable to verify your wallet."
                );

            }

            const balance =
                Number(
                    walletData.wallet?.withdrawable_balance || 0
                );

            if(balance < 50){

                container.innerHTML = `
                    <div class="account-form earning-options">
                        <h3>Tasks</h3>

                        <p class="form-note">
                            Insufficient balance. Please fund your account.
                        </p>
                    </div>
                `;

                return;
            }
        }


        /* =========================================
           LOAD TASKS
        ========================================= */

        showMessage("Loading earning options...");

        const response =
            await fetch(
                API_BASE + "/api/tasks",
                {
                    headers:{
                        Authorization:
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Failed to load tasks."
            );
        }


        /* =========================================
           MEMBERSHIP TIERS
        ========================================= */

        const tiers = [
            {
                key:"free",
                name:"FREE",
                icon:""
            },
            {
                key:"bronze",
                name:"BRONZE",
                icon:""
            },
            {
                key:"silver",
                name:"SILVER",
                icon:""
            },
            {
                key:"gold",
                name:"GOLD",
                icon:""
            },
            {
                key:"diamond",
                name:"DIAMOND",
                icon:""
            },
            {
                key:"titanium",
                name:"TITANIUM",
                icon:""
            },
            {
                key:"platinum",
                name:"PLATINUM",
                icon:""
            }
        ];

        const userTier =
            (data.membershipTier || "free").toLowerCase();

        const tierRank = {
            free:0,
            bronze:1,
            silver:2,
            gold:3,
            diamond:4,
            titanium:5,
            platinum:6
        };

        const userRank =
            tierRank[userTier] ?? 0;


        /* =========================================
           RENDER TIER MENU
        ========================================= */

        container.innerHTML = `
            <div class="tier-description">
                Choose your earning level:
            </div>

            <div class="earning-tiers">
                ${tiers.map(tier => {

                    const unlocked =
                        isAdmin ||
                        userRank >= tierRank[tier.key];

                    return `
                        <button
                            class="earning-tier ${unlocked ? "" : "locked"}"
                            data-tier="${tier.key}"
                            onclick="showTierTasks('${tier.key}')"
                        >
                            ${tier.icon} ${tier.name}
                            ${unlocked ? "" : " "}
                        </button>
                    `;

                }).join("")}
            </div>

            <div id="tierTasks"></div>
        `;

        window.smartMinuteTasks =
            Array.isArray(data.tasks)
                ? data.tasks
                : [];

        window.smartMinuteTiers =
            tiers;

        window.smartMinuteUserTier =
            userTier;

        window.smartMinuteIsAdmin =
            isAdmin;

        showTierTasks(userTier);

        showMessage(
            "Choose a membership level to view earning tasks."
        );

    } catch(error){

        console.error(
            "TASK LOAD ERROR:",
            error
        );

        container.innerHTML = "";

        showMessage(
            error.message ||
            "Unable to load earning options."
        );
    }
}


/* =========================================
   SHOW TASKS BY MEMBERSHIP TIER
========================================= */

function showTierTasks(tierKey){

    const tasks =
        window.smartMinuteTasks || [];

    const userTier =
        window.smartMinuteUserTier || "free";

    const isAdmin =
        window.smartMinuteIsAdmin === true;

    const tierRank = {
        free:0,
        bronze:1,
        silver:2,
        gold:3,
        diamond:4,
        titanium:5,
        platinum:6
    };

    const userRank =
        tierRank[userTier] ?? 0;

    const selectedRank =
        tierRank[tierKey] ?? 0;

    document
        .querySelectorAll(".earning-tier")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.tier === tierKey
            );

        });

    const tierContainer =
        document.getElementById("tierTasks");

    if(!tierContainer){
        return;
    }


    /* =========================================
       LOCKED MEMBERSHIP
    ========================================= */

    if(!isAdmin && selectedRank > userRank){

        const tierName =
            tierKey.charAt(0).toUpperCase() +
            tierKey.slice(1);

        const tierFees = {
            bronze:150,
            silver:250,
            gold:500,
            diamond:750,
            titanium:1000,
            platinum:1500
        };

        const tierFee =
            tierFees[tierKey] || 0;

        tierContainer.innerHTML = `
            <div class="task-card">

                <h3> ${tierName} Membership</h3>

                <p>
                    Upgrade to ${tierName} membership
                    to access these earning tasks.
                </p>

                <div class="tier-lock">
                    Membership upgrade required.
                </div>

                <div style="
                    margin:18px 0;
                    padding:16px;
                    border:1px solid rgba(212,175,55,.35);
                    border-radius:12px;
                    background:rgba(10,20,45,.65);
                    text-align:center;
                ">

                    <div style="
                        font-size:13px;
                        opacity:.8;
                        margin-bottom:5px;
                    ">
                        Membership Fee
                    </div>

                    <strong style="
                        font-size:24px;
                    ">
                        KSh ${tierFee.toLocaleString()}
                    </strong>

                </div>

                <button
                    class="action"
                    type="button"
                    onclick="purchaseMembership('${tierKey}')"
                >
                     Upgrade to ${tierName}
                </button>

            </div>
        `;

        showMessage(
            `Upgrade to ${tierName} membership to access these tasks.`
        );

        return;
    }


    /* =========================================
       FILTER SELECTED TIER
    ========================================= */

    const selectedTasks =
        tasks.filter(task => {

            const required =
                (task.required_membership || "free")
                    .toLowerCase();

            return required === tierKey;

        });


    if(selectedTasks.length === 0){

        tierContainer.innerHTML = `
            <div class="task-card">
                <h3>No ${tierKey.toUpperCase()} tasks yet</h3>
                <p>
                    There are currently no tasks available
                    for this membership level.
                </p>
            </div>
        `;

        showMessage(
            "No tasks are currently available for this level."
        );

        return;
    }


    /* =========================================
       RENDER TASKS
    ========================================= */

    tierContainer.innerHTML =
        selectedTasks.map(task => {

            const externalUrl =
                typeof task.external_url === "string" &&
                (() => {
                    try{
                        const url =
                            new URL(task.external_url);

                        return url.protocol === "http:" ||
                               url.protocol === "https:";

                    }catch(_){
                        return false;
                    }
                })()
                    ? task.external_url
                    : null;

            const accessible =
                isAdmin ||
                task.membershipAccess !== false;

            return `
                <div
                    class="task-card"
                    data-task-id="${task.id}"
                >

                    <h3>${task.title}</h3>

                    <p>
                        <strong>Category:</strong>
                        ${task.category || "General"}
                    </p>

                    <p>
                        ${task.description || ""}
                    </p>

                    <p>
                        <strong>Reward:</strong>
                        KSh ${task.reward}
                    </p>

                    ${task.provider ? `
                        <p>
                            <strong>Provider:</strong>
                            ${task.provider}
                        </p>
                    ` : ""}

                    ${task.requirements ? `
                        <p>
                            <strong>Requirements:</strong>
                            ${task.requirements}
                        </p>
                    ` : ""}

                    ${task.risk_notice ? `
                        <p>
                            <strong>Risk notice:</strong>
                            ${task.risk_notice}
                        </p>
                    ` : ""}

                    ${accessible ? `
                        <button
                            class="action"
                            onclick="startTask(${task.id})"
                        >
                            Start Task
                        </button>
                    ` : `
                        <div class="tier-lock">
                             Membership upgrade required
                        </div>
                    `}

                    ${externalUrl && accessible ? `
                        <button
                            type="button"
                            class="secondary-action"
                            onclick="window.open(
                                '${externalUrl}',
                                '_blank',
                                'noopener,noreferrer'
                            )"
                        >
                            Open Provider
                        </button>
                    ` : ""}

                </div>
            `;

        }).join("");

    showMessage(
        selectedTasks.length +
        " " +
        tierKey.toUpperCase() +
        " task" +
        (selectedTasks.length === 1 ? "" : "s") +
        " available"
    );
}


/* =========================================
   PURCHASE MEMBERSHIP
========================================= */

async function purchaseMembership(tierKey){

    const tierFees = {
        bronze:150,
        silver:250,
        gold:500,
        diamond:750,
        titanium:1000,
        platinum:1500
    };

    const tierNames = {
        bronze:"Bronze",
        silver:"Silver",
        gold:"Gold",
        diamond:"Diamond",
        titanium:"Titanium",
        platinum:"Platinum"
    };

    const fee = tierFees[tierKey];
    const tierName = tierNames[tierKey];

    if(!fee || !tierName){

        showMessage(
            "Invalid membership tier."
        );

        return;
    }

    const confirmed = confirm(
        "Upgrade to " +
        tierName +
        " membership for KSh " +
        fee.toLocaleString() +
        "?\\n\\n" +
        "After payment, your membership will remain pending until an administrator verifies the payment."
    );

    if(!confirmed){
        return;
    }

    const phone = prompt(
        "Enter the M-Pesa phone number used for this membership payment:"
    );

    if(!phone || !phone.trim()){

        showMessage(
            "Phone number is required."
        );

        return;
    }

    showMessage(
        "Creating membership payment request..."
    );

    try{

        const response = await fetch(
            API_BASE + "/api/membership/purchase",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    Authorization:
                        "Bearer " + token
                },

                body:JSON.stringify({
                    membershipTier:tierKey,
                    phone:phone.trim()
                })
            }
        );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to create membership payment."
            );

        }

        showMessage(
            "Membership payment request created successfully. Please complete the payment and wait for administrator verification."
        );

        alert(
            tierName +
            " membership payment request created.\\n\\n" +
            "Amount: KSh " +
            Number(data.payment?.amount || fee).toLocaleString() +
            "\\n" +
            "Status: Pending\\n\\n" +
            "Your membership will activate after payment verification."
        );

    }catch(error){

        console.error(
            "MEMBERSHIP PURCHASE ERROR:",
            error
        );

        showMessage(
            error.message ||
            "Unable to create membership payment."
        );

    }

}


/* =========================================
   START TASK
========================================= */

async function startTask(taskId){

    showMessage("Starting task...");

    try{

        const response = await fetch(
            API_BASE + "/api/tasks/" + taskId + "/start",
            {
                method:"POST",
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }
        );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Failed to start task."
            );

        }

        showMessage(
            "Task started successfully! Complete it and submit it for verification."
        );

        const attempt =
            data.attempt;

        if(attempt && attempt.id){

            const container =
                document.getElementById(
                    "tasksContainer"
                );

            const card =
                container.querySelector(
                    '[data-task-id="' + taskId + '"]'
                );

            if(card){

                card.insertAdjacentHTML(
                    "beforeend",
                    `
                    <button
                        class="action"
                        onclick="submitTask(${attempt.id})"
                    >
                         Submit Task
                    </button>
                    `
                );

            }

        }

    }catch(error){

        console.error(
            "START TASK ERROR:",
            error
        );

        showMessage(
            error.message ||
            "Unable to start task."
        );

        if (
            error.message ===
            "Insufficient balance. Please fund your account."
        ) {
            const message = document.getElementById("message");

            if (message) {
                message.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }
        }

    }

}


/* =========================================
   SUBMIT TASK
========================================= */

async function submitTask(attemptId){

    showMessage("Submitting task for verification...");

    try{

        const response = await fetch(
            API_BASE + "/api/tasks/attempt/" + attemptId + "/submit",
            {
                method:"POST",
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }
        );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Failed to submit task."
            );

        }

        showMessage(
            "Task submitted successfully. Waiting for verification."
        );

        /*
         * Disable the submit button that was just used.
         */
        const buttons =
            document.querySelectorAll(
                'button[onclick="submitTask(' + attemptId + ')"]'
            );

        buttons.forEach(button => {

            button.disabled = true;
            button.textContent = " Submitted";
            button.style.opacity = "0.65";
            button.style.cursor = "default";

        });

    }catch(error){

        console.error(
            "SUBMIT TASK ERROR:",
            error
        );

        showMessage(
            error.message ||
            "Unable to submit task."
        );

    }

}

========================================= */

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

}

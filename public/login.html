<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SmartMinute Login</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
padding:30px;
border-radius:10px;
width:320px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#0066ff;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#004ecc;
}

button:disabled{
background:#999;
cursor:not-allowed;
}

p{
text-align:center;
margin-top:15px;
}

#message{
font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h2>Login</h2>

<form id="loginForm">

<input
id="email"
type="email"
placeholder="Email"
required
>

<input
id="password"
type="password"
placeholder="Password"
required
>

<button id="loginButton" type="submit">
Login
</button>

<p id="message"></p>

</form>

<p>
Don't have an account?
<a href="register.html">Register</a>
</p>

</div>

<script>

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

form.addEventListener("submit", async function(e){

e.preventDefault();

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

message.textContent = "Connecting to SmartMinute...";
loginButton.disabled = true;

try{

const response = await fetch(
"https://smartminutes-backend.onrender.com/api/auth/login",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})
}
);

const data = await response.json();

if(response.ok){

localStorage.setItem("token", data.token);

message.textContent =
"Login successful! 🎉 Welcome " + data.user.name;

}else{

message.textContent =
"Login failed: " + (data.message || "Invalid details");

}

}catch(error){

console.error("LOGIN ERROR:",error);

message.textContent =
"Cannot connect to SmartMinute server.";

}finally{

loginButton.disabled = false;

}

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SmartMinute Login</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#020914,#071a35 55%,#15100a);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#172033;
}

.container{
    width:100%;
    max-width:410px;
}

/* GOLD MELTING CLOCK LOGO */

.brand{
    text-align:center;
    color:#f3c24b;
    margin-bottom:22px;
}

.logo{
    width:78px;
    height:78px;
    margin:0 auto 10px;
    position:relative;
    border:4px solid #d9a52e;
    border-radius:50%;
    background:radial-gradient(circle,#17130a,#07101f 70%);
    box-shadow:
        0 0 25px rgba(218,165,46,.35),
        inset 0 0 18px rgba(218,165,46,.12);
}

/* clock hands */

.logo:before{
    content:"";
    position:absolute;
    width:4px;
    height:25px;
    background:#f0c34f;
    left:50%;
    top:13px;
    transform:translateX(-50%);
    border-radius:4px;
}

.logo:after{
    content:"";
    position:absolute;
    width:22px;
    height:4px;
    background:#f0c34f;
    left:50%;
    top:37px;
    transform:rotate(35deg);
    transform-origin:left center;
    border-radius:4px;
}

/* melting gold drops */

.gold-drop{
    position:absolute;
    background:linear-gradient(#f6d15b,#b77b12);
    border-radius:0 0 12px 12px;
    box-shadow:0 3px 8px rgba(218,165,46,.3);
}

.drop1{
    width:9px;
    height:20px;
    left:13px;
    bottom:-14px;
}

.drop2{
    width:12px;
    height:29px;
    left:31px;
    bottom:-23px;
}

.drop3{
    width:8px;
    height:17px;
    right:19px;
    bottom:-12px;
}

.brand h1{
    margin:15px 0 0;
    font-size:32px;
    font-weight:800;
    color:#e8b83f;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
}

.tagline{
    margin:7px 0 0;
    font-size:13px;
    letter-spacing:4px;
    font-weight:bold;
    color:#d9a52e;
}

/* CARD */

.card{
    background:#fff;
    border-radius:20px;
    padding:30px 25px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

h2{
    text-align:center;
    margin:0;
    color:#111d31;
    font-size:27px;
}

.subtitle{
    text-align:center;
    color:#687386;
    font-size:14px;
    margin:8px 0 24px;
}

.gold-line{
    width:48px;
    height:3px;
    background:#d5a52e;
    margin:0 auto 22px;
    border-radius:5px;
}

label{
    display:block;
    margin-top:14px;
    margin-bottom:6px;
    font-size:14px;
    font-weight:bold;
    color:#263247;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d4dae3;
    border-radius:9px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#d1a02c;
    box-shadow:0 0 0 3px rgba(209,160,44,.12);
}

button{
    width:100%;
    margin-top:23px;
    padding:14px;
    background:#071a31;
    color:#e8b83f;
    border:1px solid #b88a24;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0d294b;
}

button:disabled{
    background:#888;
    color:white;
    cursor:not-allowed;
}

#message{
    text-align:center;
    min-height:20px;
    margin:15px 0 0;
    font-size:14px;
    font-weight:bold;
}

.register{
    text-align:center;
    margin-top:20px;
    color:#687386;
    font-size:14px;
}

.register a{
    color:#b17f18;
    font-weight:bold;
    text-decoration:none;
}

.footer{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-top:22px;
    color:#c7cbd3;
    text-align:center;
    font-size:11px;
}

.footer div{
    flex:1;
}

.footer strong{
    display:block;
    color:#e6b63e;
    margin-bottom:4px;
    font-size:12px;
}

@media(max-width:420px){

    body{
        padding:15px;
    }

    .brand h1{
        font-size:28px;
    }

    .card{
        padding:25px 20px;
    }

    h2{
        font-size:24px;
    }
}
</style>
<style id="smartminute-global-neon">
:root{--sm-neon-purple:#8b5cf6;--sm-neon-violet:#7c3aed;--sm-neon-pink:#ff1493;--sm-neon-magenta:#ff00e6;--sm-neon-cyan:#00f5ff;--sm-neon-blue:#1683ff;--sm-neon-yellow:#ffe600;--sm-neon-orange:#ff7a00;--sm-neon-red:#ff1744;--sm-neon-lime:#7cff00;--sm-neon-bg:#050016}
html{background:var(--sm-neon-bg)!important}
body{min-height:100vh!important;overflow-x:hidden!important;color:#fff!important;background:radial-gradient(circle at 10% 10%,rgba(139,92,246,.22),transparent 30%),radial-gradient(circle at 90% 15%,rgba(255,20,147,.20),transparent 30%),radial-gradient(circle at 20% 90%,rgba(0,245,255,.15),transparent 32%),radial-gradient(circle at 85% 85%,rgba(255,230,0,.12),transparent 30%),linear-gradient(135deg,#050016 0%,#0b0220 28%,#11001f 55%,#03051b 100%)!important}
header,.topbar,.navbar,.header,.dashboard-header{background:linear-gradient(135deg,rgba(8,2,30,.97),rgba(20,3,45,.97))!important;border-color:rgba(0,245,255,.45)!important;box-shadow:0 0 12px rgba(0,245,255,.18),0 0 28px rgba(255,0,230,.10)!important}
.card,.panel,.section,.box,.stat-card,.balance-card,.account-card,.form-card,.dashboard-card,.task-card,.referral-card,.membership-card{background:linear-gradient(145deg,rgba(20,5,48,.94),rgba(5,7,30,.97))!important;border:1px solid rgba(139,92,246,.48)!important;box-shadow:0 0 10px rgba(139,92,246,.12),0 0 24px rgba(255,20,147,.06)!important}
h1,h2,h3,h4,.title,.heading{color:#fff!important;text-shadow:0 0 6px rgba(0,245,255,.45),0 0 14px rgba(255,20,147,.25)}
input,select,textarea{background:rgba(5,0,22,.90)!important;color:#fff!important;border:1px solid rgba(0,245,255,.42)!important}
input:focus,select:focus,textarea:focus{border-color:var(--sm-neon-cyan)!important;box-shadow:0 0 7px rgba(0,245,255,.45),inset 0 0 10px rgba(0,245,255,.08)!important}
button,.btn,.primary-button,.submit-button,.deposit-button,.withdraw-button,.login-button,.register-button{border:1px solid var(--sm-neon-cyan)!important;background:linear-gradient(135deg,rgba(124,58,237,.95),rgba(255,20,147,.92),rgba(255,122,0,.88))!important;color:#fff!important;box-shadow:0 0 7px rgba(0,245,255,.55),0 0 18px rgba(255,20,147,.30)!important}
button:hover,.btn:hover,.primary-button:hover,.submit-button:hover{box-shadow:0 0 10px var(--sm-neon-cyan),0 0 24px rgba(255,20,147,.60),0 0 42px rgba(139,92,246,.35)!important}
.invite-button,.share-button{border-color:var(--sm-neon-cyan)!important;color:var(--sm-neon-cyan)!important;background:radial-gradient(circle,rgba(0,245,255,.18),rgba(8,20,42,.96) 65%)!important;box-shadow:0 0 7px var(--sm-neon-cyan),0 0 16px rgba(0,245,255,.45),inset 0 0 10px rgba(0,245,255,.12)!important}
.balance,.amount,.balance-amount,.wallet-balance,.money,.price,.earnings,.profit{color:var(--sm-neon-yellow)!important;text-shadow:0 0 6px rgba(255,230,0,.65),0 0 16px rgba(255,122,0,.35)}
.success,.positive,.verified,.approved,.completed{color:var(--sm-neon-lime)!important;text-shadow:0 0 6px rgba(124,255,0,.55)}
.warning,.pending{color:var(--sm-neon-yellow)!important}
.error,.danger,.rejected{color:var(--sm-neon-red)!important}
hr{border:0!important;height:1px!important;background:linear-gradient(90deg,transparent,var(--sm-neon-purple),var(--sm-neon-pink),var(--sm-neon-cyan),transparent)!important;box-shadow:0 0 8px rgba(0,245,255,.35)}
a{color:var(--sm-neon-cyan);text-shadow:0 0 5px rgba(0,245,255,.30)}
a:hover{color:var(--sm-neon-pink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</style>
</head>

<body>

<div class="container">

    <div class="brand">

        <div class="logo">
            <span class="gold-drop drop1"></span>
            <span class="gold-drop drop2"></span>
            <span class="gold-drop drop3"></span>
        </div>

        <h1>SmartMinute</h1>

        <div class="tagline">
            TIME IS MONEY
        </div>

    </div>

    <div class="card">

        <h2>Welcome Back</h2>

        <div class="subtitle">
            Login to your SmartMinute account
        </div>

        <div class="gold-line"></div>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button id="loginButton" type="submit">
                LOGIN
            </button>

            <p id="message"></p>

        </form>

        <div class="register">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

    </div>

    <div class="footer">

        <div>
            <strong>SECURE</strong>
            Protected
        </div>

        <div>
            <strong>FAST</strong>
            Simple
        </div>

        <div>
            <strong>SMART</strong>
            Powerful
        </div>

        <div>
            <strong>TIME</strong>
            Matters
        </div>

    </div>

</div>

<script>

const API_BASE = window.location.origin;

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    message.textContent =
        "Connecting to SmartMinute...";

    loginButton.disabled = true;

    try{

        const response = await fetch(
            API_BASE + "/api/auth/login",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    email:email,
                    password:password
                })
            }
        );

        const data = await response.json();

        if(response.ok){

            localStorage.setItem(
                "token",
                data.token
            );

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

            message.textContent =
                "Login successful! ";

            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },800);

        }else{

            message.textContent =
                "Login failed: " +
                (data.message || "Invalid details");

        }

    }catch(error){

        console.error("LOGIN ERROR:",error);

        message.textContent =
            "Cannot connect to SmartMinute server.";

    }finally{

        loginButton.disabled = false;

    }

});

</script>

</body>
</html>

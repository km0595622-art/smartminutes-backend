<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartMinute Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}

header{
background:#0066ff;
color:#fff;
padding:20px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:#fff;
margin-bottom:20px;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.balance{
font-size:32px;
color:#0066ff;
font-weight:bold;
}

.btn{
display:inline-block;
padding:12px 20px;
background:#0066ff;
color:#fff;
text-decoration:none;
border-radius:8px;
margin:8px;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}

.item{
background:#fff;
padding:20px;
text-align:center;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}
</style>

</head>
<body>

<header>
<h2>SmartMinute Dashboard</h2>
</header>

<div class="container">

<div class="card">
<p>Wallet Balance</p>
<div class="balance">KSh 0.00</div>

<a class="btn" href="#">Deposit</a>
<a class="btn" href="#">Withdraw</a>

</div>

<div class="menu">

<div class="item">Daily Tasks</div>

<div class="item">Referrals</div>

<div class="item">Transaction History</div>

<div class="item">Profile</div>

</div>

</div>

</body>
</html>
